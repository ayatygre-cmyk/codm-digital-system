<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101319">
  <title>استعادة كلمة المرور | CODM DIGITAL SYSTEM</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 20% 10%,#29313d,#090c11 65%);font-family:Tahoma,Arial,sans-serif;color:#17202d}
    .card{width:min(460px,100%);background:#fff;border-radius:18px;padding:26px;box-shadow:0 24px 70px #0008;border-top:5px solid #c62828}
    h1{font-size:21px;margin:0 0 8px;color:#101319}.sub{color:#667085;font-size:13px;line-height:1.8;margin:0 0 22px}
    label{display:block;font-size:13px;margin:14px 0 7px}input{width:100%;padding:12px;border:1px solid #cbd3df;border-radius:9px;font:inherit}
    button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:#c62828;color:#fff;font:inherit;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}.msg{margin-top:14px;font-size:13px;line-height:1.8;white-space:pre-wrap}.hidden{display:none!important}.back{display:block;text-align:center;margin-top:18px;color:#475467;font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <h1>تعيين كلمة مرور جديدة</h1>
    <p class="sub">أدخلي كلمة المرور الجديدة بعد فتح رابط الاستعادة المرسل من النادي.</p>
    <div id="waiting">جارٍ التحقق من رابط الاستعادة…</div>
    <form id="resetForm" class="hidden">
      <label for="newPassword">كلمة المرور الجديدة</label>
      <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="8 أحرف على الأقل">
      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="أعيدي كتابة كلمة المرور">
      <button id="saveButton" type="submit">حفظ كلمة المرور</button>
    </form>
    <p id="message" class="msg" role="status"></p>
    <a class="back" href="./">العودة إلى صفحة النادي</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://xmbpnjlpwpjwrjspnkro.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_umoJ2Zu3z5Hg1xrlaGif3w_q3QVwgw0';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const form = document.getElementById('resetForm');
    const waiting = document.getElementById('waiting');
    const message = document.getElementById('message');
    const saveButton = document.getElementById('saveButton');
    let recoveryReady = false;

    function showError(text) {
      waiting.classList.add('hidden');
      form.classList.add('hidden');
      message.textContent = text;
    }
    function enableForm() {
      recoveryReady = true;
      waiting.classList.add('hidden');
      form.classList.remove('hidden');
      message.textContent = 'تم التحقق من الرابط. يمكنك الآن تعيين كلمة مرور جديدة.';
    }

    client.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' && session) enableForm();
    });

    (async () => {
      const params = new URLSearchParams(window.location.hash.slice(1));
      const query = new URLSearchParams(window.location.search);
      const errorDescription = params.get('error_description') || query.get('error_description');
      if (errorDescription) return showError('تعذر التحقق من الرابط: ' + errorDescription);
      const { data, error } = await client.auth.getSession();
      if (error) return showError('تعذر التحقق من الجلسة: ' + error.message);
      if (data.session && (params.get('type') === 'recovery' || query.get('code') || recoveryReady)) {
        enableForm();
      } else if (!recoveryReady) {
        setTimeout(() => {
          if (!recoveryReady) showError('رابط الاستعادة غير صالح أو منتهي الصلاحية. يجب طلب رابط جديد بعد التأكد من إعداد إرسال البريد.');
        }, 1800);
      }
    })();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!recoveryReady) return;
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (password.length < 8) return message.textContent = 'يجب أن تتكون كلمة المرور من 8 أحرف على الأقل.';
      if (password !== confirm) return message.textContent = 'كلمتا المرور غير متطابقتين.';
      saveButton.disabled = true;
      message.textContent = 'جارٍ حفظ كلمة المرور…';
      const { error } = await client.auth.updateUser({ password });
      saveButton.disabled = false;
      if (error) {
        message.textContent = 'تعذر تغيير كلمة المرور: ' + error.message;
        return;
      }
      form.classList.add('hidden');
      message.textContent = 'تم تغيير كلمة المرور بنجاح. عودي إلى صفحة النادي وسجّلي الدخول بكلمة المرور الجديدة.';
      await client.auth.signOut();
    });
  </script>
</body>
</html>
